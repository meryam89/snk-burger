{% extends "base.html" %}

{% block title %}Inscription | SNK Burger{% endblock %}

{% block content %}
<section class="checkout-page">
    <div class="checkout-form">
        <p class="small-title orange">NOUVEAU CLIENT</p>
        <h1>Créer un compte</h1>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="field-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <button class="checkout-button" type="submit">
                Créer mon compte
            </button>
        </form>
    </div>
</section>
{% endblock %}
